# greenpt.com/honey/mac links to releases/latest/download/HoneyForMac.pkg,
# which needs an asset whose name never changes. Releases ship versioned
# HoneyForMac-x.y.z.{pkg,dmg}, so copy them under stable names on publish.
name: Attach stable-named installers

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to alias (defaults to the latest release)
        required: false

permissions:
  contents: write

jobs:
  alias:
    runs-on: ubuntu-latest
    steps:
      - name: Re-upload newest installers under stable names
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -n "$TAG" ] || TAG=$(gh release view --repo "$REPO" --json tagName --jq .tagName)
          for ext in pkg dmg; do
            asset=$(gh release view "$TAG" --repo "$REPO" --json assets \
              --jq ".assets[].name | select(test(\"^HoneyForMac-.*\\\\.$ext\$\"))" | head -n1)
            if [ -z "$asset" ]; then
              echo "No versioned .$ext on $TAG, skipping."
              continue
            fi
            gh release download "$TAG" --repo "$REPO" --pattern "$asset" --dir . --clobber
            mv "$asset" "HoneyForMac.$ext"
            gh release upload "$TAG" "HoneyForMac.$ext" --repo "$REPO" --clobber
          done
