# greenpt.com/honey/mac links to releases/latest/download/HoneyForMac.dmg,
# which needs an asset whose name never changes. Releases ship a versioned
# HoneyForMac-x.y.z.dmg, so copy it under the stable name on publish.
name: Attach stable-named dmg

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to alias (defaults to the latest release)
        required: false

permissions:
  contents: write

jobs:
  alias:
    runs-on: ubuntu-latest
    steps:
      - name: Re-upload newest dmg as HoneyForMac.dmg
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -n "$TAG" ] || TAG=$(gh release view --repo "$REPO" --json tagName --jq .tagName)
          asset=$(gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '.assets[].name | select(test("^HoneyForMac-.*\\.dmg$"))' | head -n1)
          if [ -z "$asset" ]; then
            echo "No versioned dmg on $TAG, nothing to alias." && exit 0
          fi
          gh release download "$TAG" --repo "$REPO" --pattern "$asset" --dir .
          mv "$asset" HoneyForMac.dmg
          gh release upload "$TAG" HoneyForMac.dmg --repo "$REPO" --clobber
